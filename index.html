<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali 2026</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9933, #ffcc00, #ff6600);
        color: white;
    }

    .container {
        margin-top: 8%;
    }

    h1 {
        font-size: 60px;
        color: #fff;
        text-shadow: 2px 2px 8px #000;
    }

    h2 {
        font-size: 30px;
        color: #ffff99;
    }

    .card {
        width: 70%;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        background: rgba(0,0,0,0.3);
    }

    .lamp {
        font-size: 70px;
        margin: 20px;
    }

    p {
        font-size: 24px;
        line-height: 1.6;
    }

    .name {
        color: yellow;
        font-weight: bold;
        font-size: 28px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="lamp">🪔 🪔 🪔</div>

        <h1>Happy Diwali</h1>

        <h2>Festival of Lights</h2>

        <p>
            May the divine light of Diwali bring
            peace, prosperity, happiness, and good health
            to you and your family.
        </p>

        <p>
            Wishing you success, joy, and endless blessings
            throughout the year.
        </p>

        <p class="name">
            Best Wishes From<br>
            Annamalai Kesavan
        </p>

        <div class="lamp">✨ 🎆 🪔 🎇 ✨</div>

    </div>
</div>

</body>
</html>
